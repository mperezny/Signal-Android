name: Build Signal Android

on:
  workflow_dispatch:
  push:
    branches:
      - splitlayout

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemblePlayProdDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Signal-APK
          path: |
            app/build/outputs/**/*.apk
