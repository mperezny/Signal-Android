name: Update Gradle Verification Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-verification-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5632m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          android.enableJetifier=false
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e

          if [ -d "Signal-Android" ]; then
            GOOGLE_SERVICES_TARGET="Signal-Android/google-services.json"
          else
            GOOGLE_SERVICES_TARGET="google-services.json"
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$GOOGLE_SERVICES_TARGET"

          if [ ! -s "$GOOGLE_SERVICES_TARGET" ]; then
            echo "google-services.json was not restored correctly"
            exit 1
          fi

          echo "Restored $GOOGLE_SERVICES_TARGET"

      - name: Generate Gradle verification metadata
        run: |
          ./gradlew --write-verification-metadata pgp,sha256 --export-keys :Signal-Android:help \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Show changed files
        run: |
          git status
          git diff -- gradle/verification-metadata.xml || true

      - name: Commit verification metadata
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradle/verification-metadata.xml gradle/verification-keyring.keys || true

          if git diff --cached --quiet; then
            echo "No verification metadata changes to commit"
            exit 0
          fi

          git commit -m "Update Gradle dependency verification metadata"
          git push
