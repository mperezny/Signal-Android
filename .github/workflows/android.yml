name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - SplitLayout
      - splitlayout
      - '7.**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5632m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          android.enableJetifier=false
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e

          if [ -d "Signal-Android" ]; then
            GOOGLE_SERVICES_TARGET="Signal-Android/google-services.json"
          else
            GOOGLE_SERVICES_TARGET="google-services.json"
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$GOOGLE_SERVICES_TARGET"

          if [ ! -s "$GOOGLE_SERVICES_TARGET" ]; then
            echo "google-services.json was not restored correctly"
            exit 1
          fi

          echo "Restored $GOOGLE_SERVICES_TARGET"

      - name: Build PlayProd Release APK
        env:
          GRADLE_OPTS: "-Xmx5632m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
        run: |
          ./gradlew :Signal-Android:assemblePlayProdRelease \
            --build-cache \
            --no-configuration-cache \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Sign ARM64 APK
        if: success()
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > signal-custom-release.jks

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)"

          UNSIGNED_APK="$(find . -path "*/build/outputs/apk/playProd/release/*arm64-v8a*release-unsigned*.apk" | head -n 1)"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned ARM64 APK not found"
            find . -path "*/build/outputs/apk/**/*.apk"
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"
          echo "Build tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" signal-playprod-arm64-v8a-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks signal-custom-release.jks \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out signal-playprod-arm64-v8a-release-signed.apk \
            signal-playprod-arm64-v8a-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            signal-playprod-arm64-v8a-release-signed.apk 

      - name: Upload signed ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signal-playprod-release-arm64-v8a-signed
          path: |
            signal-playprod-arm64-v8a-release-signed.apk

      - name: Archive reports for failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports
          path: |
            **/build/reports
