name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - SplitLayout
      - splitlayout
      - '7.**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5632m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          android.enableJetifier=false
          EOF

      - name: Build PlayProd Release APK
        env:
          GRADLE_OPTS: "-Xmx5632m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
        run: |
          ./gradlew :Signal-Android:assemblePlayProdRelease \
            --build-cache \
            --no-configuration-cache \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Upload ARM64 APK only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signal-playprod-release-arm64-v8a
          path: |
            **/build/outputs/**/playProd/release/*arm64-v8a*.apk

      - name: Archive reports for failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports
          path: |
            **/build/reports
