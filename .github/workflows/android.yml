name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - splitlayout
      - '7.**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m -Dkotlin.daemon.jvm.options=-Xmx1536m"
        run: |
          ./gradlew :Signal-Android:assemblePlayProdDebug \
            --build-cache \
            --configuration-cache \
            --no-daemon \
            --max-workers=2

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signal-apk
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab

      - name: Archive reports for failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports
          path: |
            **/build/reports
